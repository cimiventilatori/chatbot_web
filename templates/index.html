<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Documentale</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #333;
    }

    header {
      background-color: #2563eb;
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      margin-top: 20px;
    }

    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      max-height: calc(100vh - 220px);
    }

    .message {
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .user {
      text-align: right;
      color: #2563eb;
      font-weight: bold;
    }

    .bot {
      text-align: left;
      color: #111827;
    }

    #input-area {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 10px;
      background-color: #f9fafb;
    }

    #user-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      resize: none;
      height: 50px;
    }

    #send-btn {
      margin-left: 10px;
      padding: 0 25px;
      font-size: 1rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #send-btn:hover {
      background-color: #1d4ed8;
    }

    #loading {
      text-align: center;
      color: #666;
      font-style: italic;
      display: none;
      margin-top: 5px;
      font-size: 0.95rem;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0% { opacity: 0.2; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <header>Chatbot Documentale</header>

  <div id="chat-container">
    <div id="chat-box"></div>

    <div id="loading">💭 Sto pensando...</div>

    <div id="input-area">
      <textarea id="user-input" placeholder="Scrivi un messaggio..."></textarea>
      <button id="send-btn">Invia</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const chatBox = document.getElementById("chat-box");
    const loading = document.getElementById("loading");

    function appendMessage(sender, text, animated = false) {
      const message = document.createElement("div");
      message.classList.add("message", sender);
      chatBox.appendChild(message);

      if (animated) {
        let i = 0;
        function typeChar() {
          if (i < text.length) {
            message.innerHTML = text.slice(0, i + 1).replace(/\n/g, "<br>");
            chatBox.scrollTop = chatBox.scrollHeight;
            i++;
            setTimeout(typeChar, 12);
          }
        }
        typeChar();
      } else {
        message.innerHTML = text.replace(/\n/g, "<br>");
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      appendMessage("user", text);
      input.value = "";

      loading.style.display = "block"; // Mostra "Sto pensando..."

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });

        const data = await response.json();
        loading.style.display = "none"; // Nasconde il loader

        appendMessage("bot", data.response, true); // Risposta con effetto digitazione
      } catch (error) {
        loading.style.display = "none";
        appendMessage("bot", "⚠️ Errore di comunicazione con il server.");
      }
    }

    // Pulsante invio
    sendBtn.addEventListener("click", sendMessage);

    // Tasto Enter per inviare
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
